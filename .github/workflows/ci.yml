name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run pre-commit suite
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: OpenGrep static analysis
        run: |
          curl -sL -o /tmp/opengrep https://github.com/opengrep/opengrep/releases/download/v1.31.0/opengrep_manylinux_x86
          chmod +x /tmp/opengrep
          #  Ada is outside OpenGrep's rule coverage, so this surfaces
          #  findings on scripts/workflows/docs; Ada assurance is GNATprove
          #  Silver in build-test-prove. Whole-repo scan: .gitignore output
          #  (obj/, bin/) is skipped automatically.
          /tmp/opengrep scan --quiet .

  build-test-prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Alire
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -o /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          rm -rf /tmp/alire-dist && mkdir -p /tmp/alire-dist
          unzip -o -q /tmp/alire.zip -d /tmp/alire-dist
          install -m 0755 /tmp/alire-dist/bin/alr "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/alr" --version

      - name: Build library
        run: alr -n build

      - name: AUnit suite (alr test)
        run: alr test

      - name: Build examples
        run: alr exec -- gprbuild -P examples/examples.gpr

      - name: GNATprove Silver
        run: alr exec -- gnatprove -P pcapng_in_ada.gpr --mode=silver --level=2 --checks-as-errors=on

      - name: GNATprove Gold (full crate, zero unproved checks)
        run: alr exec -- gnatprove -P pcapng_in_ada.gpr --mode=gold --level=2 --checks-as-errors=on

      - name: Upload test binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-binaries
          path: bin/
          if-no-files-found: ignore

  differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Alire
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -o /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          rm -rf /tmp/alire-dist && mkdir -p /tmp/alire-dist
          unzip -o -q /tmp/alire.zip -d /tmp/alire-dist
          install -m 0755 /tmp/alire-dist/bin/alr "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/alr" --version

      - name: Deploy toolchain and build library
        #  The fuzz/differential scripts call bare gprbuild after
        #  `alr printenv`; on a fresh runner the toolchain is not
        #  deployed until the first alr build, so build once here.
        run: alr -n build

      - name: Try install tshark (oracle, best-effort)
        continue-on-error: true
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends tshark

      - name: Fuzz smoke + differential
        run: |
          sh scripts/fuzz-smoke.sh
          sh scripts/differential.sh
